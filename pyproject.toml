[project]
name = "readme2run"
version = "0.1.0"
description = "Read a repository README and run it in a sandbox."
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "docker",
    "crewai",
    "pyyaml",
    "rich",
    "pytest",
]

[project.scripts]
readme2run = "readme2run.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readme2run"]
